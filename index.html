<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balatro on the Web</title>
    <style>
      :root {
  --bg: #111;
  --fg: #eee;
  --disabled-accent: #2b746f;
  --accent: #66fcf1;
  --hover-accent: #5ae2e0;
  --active-accent: #358888;
  --muted: #888;
  --border: #333;
  --danger: #e74c3c;
  --card: #1f1f1f;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: sans-serif;
  margin: 0;
  padding: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 2rem;
}

h1, h2, h3, h4, h5, h6 {
  color: var(--accent);
}

section {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1rem;
  margin-bottom: 1.5rem;
  border-radius: 8px;
}

.options {
    margin: auto;
    width: fit-content
}

.options label {
  margin-right: 1rem;
}

input[type="text"] {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.4rem 0.6rem;
}

button {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 0.5rem 1rem;
  margin: 0.25rem;
  cursor: pointer;
  border-radius: 4px;
  font-weight: bold;
  transition: background 0.2s ease;
}

button[disabled] {
  background: var(--disabled-accent);
  cursor: not-allowed;
}

button.hidden {
  display: none;
}

button:not([disabled]):hover {
  background: var(--hover-accent);
}

button:not([disabled]):active {
  background: var(--active-accent);
}

progress {
  width: 100%;
  height: 20px;
  margin-top: 0.5rem;
  appearance: none;
}

progress::-webkit-progress-bar {
  background-color: #333;
  border-radius: 4px;
}

progress::-webkit-progress-value {
  background-color: var(--accent);
  border-radius: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
}

table th, table td {
  border: 1px solid var(--border);
  padding: 0.5rem 1rem;
  text-align: left;
}

table th {
  background: #222;
}

.modal {
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.75);
}

.modal.hidden {
  display: none;
}

.modal-content {
  background-color: var(--card);
  padding: 2rem;
  border-radius: 12px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  color: var(--fg);
  position: relative;
  border: 1px solid var(--danger);
}

.modal-content h2 {
  color: var(--danger);
}

.modal-content p {
  margin: 1rem 0 0 0;
}

.close {
  position: absolute;
  top: 0.5rem;
  right: 1rem;
  font-size: 1.5rem;
  color: var(--danger);
  cursor: pointer;
}

.addMods {
  width: fit-content;
  margin: auto;
  text-align: center;
}

.center {
  width: fit-content;
  margin: auto;
}

label {
  user-select: none;
}

#parseBtn {
  height: 5em;
  width: 8em;
}

.leftAlign {
  text-align: left;
}

#loadedName {
  display: inline;
}

label[for=makeName] {.game
  color: var(--accent);
}

input#makeName {
  width: 80%;
  background-color: var(--border);
  color: white
}

.makeName {
  margin: auto;
  text-align: center;
}

.game {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas#canvas {
  display: block;
  position: absolute;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}
    </style>
    <script>
      class BufferReader {
    /**
     * 
     * @param {ArrayBuffer} arrayBuffer 
     * @param {boolean} littleEndian 
     */
    constructor(arrayBuffer, littleEndian = true) {
        this.view = new DataView(arrayBuffer)
        this.offset = 0
        this.littleEndian = littleEndian
    }

    u8() {
        return this.view.getUint8(this.offset++)
    }

    i8() {
        return this.view.getInt8(this.offset++)
    }

    u16() {
        const val = this.view.getUint16(this.offset, this.littleEndian)
        this.offset += 2
        return val
    }

    i16() {
        const val = this.view.getInt16(this.offset, this.littleEndian)
        this.offset += 2
        return val
    }

    u32() {
        const val = this.view.getUint32(this.offset, this.littleEndian)
        this.offset += 4
        return val
    }

    i32() {
        const val = this.view.getInt32(this.offset, this.littleEndian)
        this.offset += 4
        return val
    }

    f32() {
        const val = this.view.getFloat32(this.offset, this.littleEndian)
        this.offset += 4
        return val
    }

    f16() {
        const val = this.view.getFloat16(this.offset, this.littleEndian)
        this.offset += 2
        return val
    }

    bytes(n) {
        const result = this.view.buffer.slice(this.offset, this.offset + n)
        this.offset += n
        return result
    }

    string(n) {
        const bytes = this.bytes(n)
        return new TextDecoder().decode(bytes)
    }

    goto(n) {
        this.offset = n
    }

    step(n) {
        this.offset += n
    }
}

class BufferWriter {
    constructor(size, littleEndian = true) {
        this.buffer = new ArrayBuffer(size)
        this.view = new DataView(this.buffer)
        this.offset = 0
        this.littleEndian = littleEndian
    }

    u8(value) {
        this.view.setUint8(this.offset++, value)
    }

    i8(value) {
        this.view.setInt8(this.offset++, value)
    }

    u16(value) {
        this.view.setUint16(this.offset, value, this.littleEndian)
        this.offset += 2
    }

    i16(value) {
        this.view.setInt16(this.offset, value, this.littleEndian)
        this.offset += 2
    }

    u32(value) {
        this.view.setUint32(this.offset, value, this.littleEndian)
        this.offset += 4
    }

    i32(value) {
        this.view.setInt32(this.offset, value, this.littleEndian)
        this.offset += 4
    }

    f32(value) {
        this.view.setFloat32(this.offset, value, this.littleEndian)
        this.offset += 4
    }

    f16(value) {
        if (typeof this.view.setFloat16 === "function") {
            this.view.setFloat16(this.offset, value, this.littleEndian)
        } else {
            // Manual conversion fallback (optional)
            throw new Error("setFloat16 is not supported in this environment")
        }
        this.offset += 2
    }

    bytes(byteArray) {
        if (!(byteArray instanceof Uint8Array)) {
            throw new TypeError("bytes() expects a Uint8Array")
        }
        new Uint8Array(this.buffer, this.offset, byteArray.length).set(byteArray)
        this.offset += byteArray.length
    }

    getBuffer() {
        return this.buffer.slice(0, this.offset)
    }
}

      /**
 * @param {string} version - The name of the version to run.
 */
function runVersion(version) {
    loadCachedGame(version).then(
        /**
         * 
         * @param {Blob} game - The zip data of the game
         */
        async (game) => {
            const PREFIX = "Balatro_" + version + "_";
            const originalOpen = indexedDB.open;
            const originalDeleteDatabase = indexedDB.deleteDatabase;
            indexedDB.open = function(name, version) {
                const prefixedName = PREFIX + name;
                return version !== undefined
                ? originalOpen.call(this, prefixedName, version)
                : originalOpen.call(this, prefixedName);
            };
            indexedDB.deleteDatabase = function(name) {
                const prefixedName = PREFIX + name;
                return originalDeleteDatabase.call(this, prefixedName);
            };
            document.body.innerHTML = ""
            const canvas = document.createElement("canvas")
            canvas.id = "canvas"
            document.body.appendChild(canvas)
            const GAME_WIDTH = 1920;
            const GAME_HEIGHT = 1080;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;

                  function resizeCanvas() {
            const container = document.body;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            
            const scaleX = containerWidth / GAME_WIDTH;
            const scaleY = containerHeight / GAME_HEIGHT;
            const scale = Math.min(scaleX, scaleY);
            
            canvas.style.width = (GAME_WIDTH * scale) + 'px';
            canvas.style.height = (GAME_HEIGHT * scale) + 'px';
        }

        // Initial resize
        resizeCanvas();
        
        // Add resize listener
        window.addEventListener('resize', resizeCanvas);

            // Disable fullscreen — browsers block automatic fullscreen requests
            canvas.requestFullscreen = function() { return Promise.resolve(); }
            document.documentElement.requestFullscreen = function() { return Promise.resolve(); }
            Element.prototype.requestFullscreen = function() { return Promise.resolve(); }

            const data = new Uint8Array(await game.arrayBuffer())

            Module.INITIAL_MEMORY = 268435456

            Module.printErr = console.error

            Module.preRun = [
                function () { // Load game.love into the fs
                    Module.addRunDependency("fp game.love");
                    var ptr = Module.getMemory(data.length);
                    Module['HEAPU8'].set(data, ptr); // Put data after the chunk of memory
                    Module.FS_createDataFile('/', "game.love", data, true, true, true); // Add the file
                    Module.removeRunDependency("fp game.love");
                }

                Love(Module);
            };
            document.body.appendChild(s);

        (error) => {
            throw new Error("Unknown game version '" +version + "'")
        }
    )

            progress_bar.value = 0;
            return
        }

        const save_data_id = "Balatro_" + loaded_game_id + "_/home/web_user/love"

        status_text.innerText = "Opening Save Database"
        progress_bar.value = 40;

        const request = indexedDB.open(save_data_id);
        /** @type {IDBDatabase} */
        const db = await new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        let tx = db.transaction('FILE_DATA', 'readwrite');
        let store = tx.objectStore('FILE_DATA');

        status_text.innerText = "Clearing Files"
        progress_bar.value = 80;

        await new Promise((resolve, reject) => {
            const cursorRequest = store.openCursor();

            cursorRequest.onsuccess = async (event) => {
                /** @type {IDBCursorWithValue} */
                const cursor = event.target.result;
                if (cursor) {
                    await unwrapIDBRequest(store.delete(cursor.key))

                    cursor.continue();
                } else {
                    resolve();
                }
            };
            cursorRequest.onerror = () => reject(cursorRequest.error);
        });

        status_text.innerText = "Ready"
        progress_bar.value = 0;
    }
}

      var mods = {}

async function isMod(dir) {
    try {
        await dir.getFileHandle("lovely.toml")
        return true
    } catch {
        try {
            await dir.getDirectoryHandle("lovely")
            return true
        } catch {
            return false
        }
    }
}

async function directoryToObject(dir, isRoot=false, showCompatibleWarning=true) {
    if (isRoot) {
        try {
            await dir.getFileHandle("webcompatible")
        } catch (err) {
            if (showCompatibleWarning) {
                alert("Mod " + dir.name + " may not be web compatible.")
            }
        }
    }
    const object = {}
    for await (const [path, obj] of dir.entries()) {
        if (obj.kind == "directory") {
            object[path] = await directoryToObject(obj)
        } else {
            object[path] = await obj.getFile()
        }
    }
    return object
}

async function pickDirectoryFallback() {
    return new Promise((resolve) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.webkitdirectory = true;
        input.onchange = () => resolve(input.files);
        input.click();
    });
}

function fileListToObject(files, rootName) {
    const root = {};
    for (const file of files) {
        const parts = file.webkitRelativePath.split('/').slice(1);
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
            node[parts[i]] ??= {};
            node = node[parts[i]];
        }
        node[parts[parts.length - 1]] = file;
    }
    return root;
}

async function addModDir() {
    $("makeName").placeholder = "Modded";

    if (window.showDirectoryPicker) {
        const dir_picker = await showDirectoryPicker({ mode: "read", startIn: "downloads" });
        if (await isMod(dir_picker)) {
            mods[dir_picker.name] = await directoryToObject(dir_picker, true)
        } else {
            for await (const [path, obj] of dir_picker.entries()) {
                if (obj.kind == "directory") {
                    mods[obj.name] = await directoryToObject(obj, true)
                }
            }
        }
    } else {
        const files = await pickDirectoryFallback();
        if (!files.length) return;
        const dirName = files[0].webkitRelativePath.split('/')[0];
        const tree = fileListToObject(files, dirName);

        const isSingleMod = 'lovely.toml' in tree || 'lovely' in tree;
        if (isSingleMod) {
            if (!('webcompatible' in tree)) alert("Mod " + dirName + " may not be web compatible.");
            mods[dirName] = tree;
        } else {
            for (const [name, subtree] of Object.entries(tree)) {
                if (typeof subtree === 'object' && !(subtree instanceof File)) {
                    if (!('webcompatible' in subtree)) alert("Mod " + name + " may not be web compatible.");
                    mods[name] = subtree;
                }
            }
        }
    }

    renderModsList()
}

function clearMods() {
    mods = {}
    renderModsList()
}

function renderModsList() {
    const list = $("mod-list");
    list.innerHTML = "";
    for (const mod_name of Object.keys(mods)) {
        const mod_item = document.createElement("label");
        mod_item.innerText = mod_name;
        if (mods["Dump from Lovely"] && mod_name != "Dump from Lovely") {
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = false;
            checkbox.onchange = function() {
                if (checkbox.checked) {
                    mods[mod_name]["dont_patch.txt"] = new File(["true"], "dont_patch.txt", { type: "text/plain" })
                }
            }
            mod_item.prepend(checkbox);
        }
        list.appendChild(mod_item);
        list.appendChild(document.createElement("br"));
    }
}

async function useLovelyDump() {
    if (window.showDirectoryPicker) {
        const dir_picker = await showDirectoryPicker({ mode: "read", startIn: "downloads" });
        mods["Dump from Lovely"] = await directoryToObject(dir_picker, true, false)
    } else {
        const files = await pickDirectoryFallback();
        if (!files.length) return;
        const dirName = files[0].webkitRelativePath.split('/')[0];
        mods["Dump from Lovely"] = fileListToObject(files, dirName);
    }
    alert("Click the checkboxes next to the mods that were in provided dump.")
    renderModsList()
}

  end
  return bitop

  "nativefs.lua": `-- faknativefs.lua
local nativefs = {}

function join_path(a, b)
    -- If b is absolute (starts with /), return b as-is only if a is empty
    if b:find("^/") and a == "" then return b end
    -- Strip leading slashes from b to avoid double-slash issues
    b = b:gsub("^/+", "")
    if a == "" then return b end
    if not a:find("/$") then a = a .. "/" end
    return (a .. b):gsub("//+", "/")
end

nativefs.workingDirectory = ""

-- Read a file from the game's source or save directory
function nativefs.read(filename)
    local fullpath = join_path(nativefs.workingDirectory, filename)
    -- Try full path first
    local ok, result = pcall(love.filesystem.read, fullpath)
    if ok and result then return result end
    -- Try filename directly (in case workingDirectory already included)
    ok, result = pcall(love.filesystem.read, filename)
    if ok and result then return result end
    return nil, "File does not exist: " .. tostring(fullpath)
end

-- Write to a file in the save directory
function nativefs.write(filename, contents)
    return love.filesystem.write(join_path(nativefs.workingDirectory, filename), contents)
end

-- Check if a path exists and get info
function nativefs.getInfo(path)
    local fullpath = join_path(nativefs.workingDirectory, path)
    -- Use love.filesystem.getInfo without type filter to get raw info
    local ok, info = pcall(love.filesystem.getInfo, fullpath)
    if not ok or not info then return nil end
    -- Normalize numeric types to strings
    local t = info.type
    if t == 0 or t == "file" then info.type = "file"
    elseif t == 1 or t == "directory" then info.type = "directory"
    elseif t == 2 or t == "symlink" then info.type = "symlink"
    else info.type = "other" end
    return info
end

function nativefs.getDirectoryItemsInfo(path)
    -- { type: "directory" | "file", name: "..." }
    local fullpath = join_path(nativefs.workingDirectory, path)
    local files = love.filesystem.getDirectoryItems(fullpath)
    local out = {}
    for i, v in ipairs(files) do
        local itempath = join_path(fullpath, v)
        local ok, info = pcall(love.filesystem.getInfo, itempath)
        local t = "file"
        if ok and info then
            local raw = info.type
            if raw == 1 or raw == "directory" then t = "directory"
            elseif raw == 2 or raw == "symlink" then t = "symlink"
            else t = "file" end
        end
        out[#out+1] = { name = v, type = t, size = 0, modtime = 0 }
    end
    return out
end

-- Check if a file exists
function nativefs.exists(path)
    return love.filesystem.getInfo(join_path(nativefs.workingDirectory, path)) ~= nil
end

-- List directory contents
function nativefs.getDirectoryItems(path)
    return love.filesystem.getDirectoryItems(join_path(nativefs.workingDirectory, path))
end

-- Create a directory
function nativefs.mkdir(path)
    return love.filesystem.createDirectory(join_path(nativefs.workingDirectory, path))
end

-- Remove a file or directory
function nativefs.remove(path)
    return love.filesystem.remove(join_path(nativefs.workingDirectory, path))
end

-- Load Lua file as chunk
function nativefs.load(filename)
    local contents, err = love.filesystem.read(join_path(nativefs.workingDirectory, filename))
    if not contents then return nil, err end
    return load(contents, '@' .. filename)
end

function nativefs.newFileData(path)
    return love.filesystem.newFileData(join_path(nativefs.workingDirectory, path))
end

function nativefs.setWorkingDirectory(path)
    -- If path is absolute or starts with a known absolute prefix, reset working dir
    if path:find("^/") or path:find("^[A-Za-z]:") then
        nativefs.workingDirectory = ""
        print("Navigated to / (absolute path reset)")
    else
        nativefs.workingDirectory = join_path(nativefs.workingDirectory, path)
        print("Navigated to "..nativefs.workingDirectory)
    end
end

function nativefs.getWorkingDirectory()
    return nativefs.workingDirectory
end

-- Read as lines (like nativefs.lines)
function nativefs.lines(filename)
    local content = nativefs.read(filename)
    local i = 1
    return function()
        if not content then return nil end
        local next_newline = content:find("\\n", i)
        if not next_newline then
            local line = content:sub(i)
            content = nil
            return line
        else
            local line = content:sub(i, next_newline - 1)
            i = next_newline + 1
            return line
        end
    end
end

return nativefs`,

    local function try_read(p)
        local ok, result = pcall(love.filesystem.read, p)
        if ok and result then return result end
        return nil
    end
    local tries = {
        path,
        "resources/shaders/" .. path,
        "resources/" .. path,
    }
    for _, p in ipairs(tries) do
        local contents = try_read(p)
        if contents then
            print("apply_patches: got contents for " .. p .. " (" .. #contents .. " bytes)")
            return contents
        end
    end
    if NFS then
        local old_wd = NFS.getWorkingDirectory()
        NFS.workingDirectory = ""
        for _, p in ipairs(tries) do
            local ok, contents = pcall(NFS.read, p)
            if ok and contents then
                NFS.workingDirectory = old_wd
                print("apply_patches: got contents via NFS for " .. p)
                return contents
            end
        end
        NFS.workingDirectory = old_wd
    end
    print("apply_patches: NOT FOUND, using passthrough for " .. tostring(path))
    return [[
        #ifdef VERTEX
        vec4 position(mat4 transform_projection, vec4 vertex_position) {
            return transform_projection * vertex_position;
        }
        #endif
        #ifdef PIXEL
        vec4 effect(vec4 color, Image texture, vec2 texture_coords, vec2 screen_coords) {
            return Texel(texture, texture_coords) * color;
        }
        #endif
    ]]
end

return lovely`

function openGameDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("BalatroCacheDB", 1);

        request.onupgradeneeded = () => {
            request.result.createObjectStore("cache");
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function loadCachedGame(key="vanilla") {
    const db = await openGameDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction("cache", "readonly");
        const store = tx.objectStore("cache");
        const getReq = store.get(key);

        // Issue #1: run db.close so that other tabs can access the database
        getReq.onsuccess = () => {
            db.close()
            resolve(getReq.result || null);
        };
        getReq.onerror = () => {
            db.close()
            reject(putReq.error)
        };
    });
}

async function saveGameToCache(blob, key="vanilla") {
    const db = await openGameDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction("cache", "readwrite");
        const store = tx.objectStore("cache");
        const putReq = store.put(blob, key);

        putReq.onsuccess = () => {
            db.close()
            resolve();
        };
        putReq.onerror = () => {
            db.close()
            reject(putReq.error)
        };
    });
}

async function deleteCachedGame(key) {
    const db = await openGameDB()
    return new Promise((res, rej) => {
        const tx = db.transaction("cache", "readwrite");
        const store = tx.objectStore("cache");
        const deleteReq = store.delete(key)

        deleteReq.onsuccess = () => {
            db.close()
            res();
        };
        deleteReq.onerror = () => {
            db.close()
            rej(deleteReq.error)
        };
    })
}

async function listCachedVersions() {
    const db = await openGameDB()
    const tx = db.transaction("cache", "readonly")
    const store = tx.objectStore("cache")

    return new Promise((res, rej) => {
        const found_types = []

        const cursor = store.openCursor()
        cursor.onsuccess = (evt) => {
            /** @type {IDBCursorWithValue | undefined} */
            const cursor = evt.target.result
            if (cursor) {
                found_types.push(cursor.key)

                cursor.continue()
            } else {
                db.close()
                res(found_types)
            }
        }
        cursor.onerror = () => {
            db.close()
        }
    })
}

      function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // $& means the whole matched string
}
function string_searchAll(string, regex) {
    regex = regex.toString().replace(/\/(.*)\/g/, "$1")
    const positions = []
    let nextRegex = regex
    while (true) {
        result = string.search(new RegExp(nextRegex))
        if (result == -1) break
        nextRegex = ".{" + result + ",}?" + regex
        positions.push(result)
    }
    return positions
}
function fixTomlQuotes(text) {

async function fixGotoInZip(zipfile) {
    for (const path of Object.keys(zipfile.files)) {
        if (!path.endsWith('.lua')) continue

        if (!file) continue
        let contents = await file.async('string')
        if (!contents.includes('goto') && !contents.includes('::')) continue
        contents = contents.replace(/\bthen\s+goto\s+\w+\s+end/g, 'then end')
        contents = contents.replace(/\bgoto\s+\w+/g, '-- goto (removed)')
        contents = contents.replace(/::\w+::/g, '')

    let modules_to_load = {}
    for (const patch_data of patch_list) {
        status_text.innerText = "Applying mod " + patch_data.name
        for (const block of patch_data.src.patches) {

                const patch = block.pattern; patch.limit = patch.limit || Infinity
                let contents = await get_file(patch.target); if (contents === null) continue
                if (patch.position == "at") contents = contents.replace(patch.pattern, patch.payload)
                else if (patch.position == "before") contents = contents.replace(patch.pattern, patch.payload + " " + patch.pattern)
                else contents = contents.replace(patch.pattern, patch.pattern + " " + patch.payload)

            if (block.regex && !patch_data.dont_patch) {

                patch.payload = patch.line_prepend + patch.payload.replace("\n", "\n" + patch.line_prepend)

                let contents = await get_file(patch.target); if (contents === null) continue
                let locs = [], data
                while ((data = pattern.exec(contents)) !== null) locs.push({ index: data.index, index_groups: data.slice(1), groups: data.groups ?? {}, match: data[0] })
                let delta = 0, i = 0
                for (const match of locs) {
                    if (i > patch.limit) break; i++
                    let replacer = patch.payload, original_size = match.match.length
                    for (let j = 0; j < match.index_groups.length; j++) replacer = replacer.replaceAll("$" + (j + 1), match.index_groups[j])
                    for (const [key, value] of Object.entries(match.groups)) replacer = replacer.replaceAll("$" + key, value)

                    else if (patch.position == "before") { contents = contents.slice(0, match.index + delta) + replacer + contents.slice(match.index + delta); delta += replacer.length }
                    else { contents = contents.slice(0, match.index + delta + original_size) + replacer + contents.slice(match.index + delta + original_size); delta += replacer.length }

        progress_bar.value = "80"

        {

function getArrayBufferFromBlob(blob) {
    let resolve, reject, promise = new Promise((res, rej) => {resolve = res; reject = rej});
    const reader = new FileReader();
    reader.onload = function() {
        resolve(reader.result)
    };
    reader.onerror = function() {
        reject()
    }
    reader.readAsArrayBuffer(blob);
    return promise;
}

                    }
                }
            } else {
                if (!name) {
                    version_name_input.value = "vanilla"
                    name = "vanilla"
                }
                if (name != "vanilla") {
                    if (!confirm("Create a new version without mods, which is not called vanilla? This is redundant unless you want more save slots.")) {
                        return
                    }
                }
            }

            game = await buildFromSource(file, mods);

            progress_bar.value = "95"
            status_text.innerText = "Saving to Cache"

            await saveGameToCache(game, name);

            progress_bar.value = "100"
            status_text.innerText = "Done"

            build_button.classList.remove("hidden")

            setTimeout(() => {
                progress_bar.value = "0"
            }, 1000)

            renderVersionList()
            
        } catch (err) {
            progress_bar.classList.add("hidden")
            showError(err instanceof Error ? err.message : String(err))
            console.error(err)
        } finally {
            build_button.disabled = false
            file_input.parentElement.classList.remove("disabled")
            file_input.disabled = false;
            version_name_input.disabled = false;
        }
    });

    // build_button.addEventListener("click", function() {
    //     var s = document.createElement('script');
    //     s.type = 'text/javascript';
    //     s.src = "single_file.js"; // THICC FILE
    //     s.async = true;
    //     s.onload = async function () {
    //         const game_uri = await getDataURIFromBlob(game)

    //         const zip = new JSZip()
    //         for (const file_name of Object.keys(window.templates)) {
    //             zip.file(file_name, window.templates[file_name].replace("%%DATAURI%%", game_uri))
    //         }
    //         saveAs(await zip.generateAsync({type: "blob"}), "balatro.zip")
    //     };
    //     document.body.appendChild(s);
    // })
    
    try {
        await renderVersionList()
        status_text.innerText = "Ready"
    } catch (err) {
        showError(err.message)
    }
})
    </script>
  </head>
  <body>
    <div class="container">
      <h1>Balatro</h1>

      <section>
        <h2>New Version</h2>
        <div class="options">
          <label><input type="radio" name="source" value="file" checked id="loadExeRadio"/> Load .exe or .love</label><a href="whereisexe.html">(?)</a>&nbsp;<input type="file" id="exeInput"><br>
          <label><input type="radio" name="source" value="vanilla" disabled id="loadVanillaRadio"/> Use Vanilla</label>
        </div>
        
        <h3>Mods</h3>
        <div class="addMods">
          <button id="addModDir">Add Mod Folder</button>
          <button id="clearMods">Clear Mods</button>
          <button id="useLovelyDump">Use Lovely Dump</button>
          <h4>Mods Found:</h4>
          <div class="leftAlign" id="mod-list"></div>
        </div>
        <div class="makeName">
          <label for="makeName">Name: </label><input id="makeName" placeholder="vanilla">
        </div>
        <div class="center">
          <button id="parseBtn" disabled>Build</button>
        </div>
        <progress id="progressBar" value="0" max="100" class="progress hidden"></progress>
        <div class="center">
          <p id="status">Loading Cache</p>
        </div>
      </section>

      <section>
        <h2>Player</h2>
        <div class="player-controls">
          <p id="loadedName">Nothing loaded</p>
          <button id="runBtn" disabled>Start Game</button>
          <button id="downloadCachedBtn" disabled>Download Version</button>
          <button id="makePortableBtn" disabled>Make Portable</button>
        </div>
      </section>

      <section>
        <h2>Save Data</h2>
        <button disabled id="save-download">Download</button>
        <button disabled id="save-upload">Upload</button>
        <button disabled id="save-delete">Delete</button>
      </section>

      <section>
        <h2>Versions</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="versionsList">
          </tbody>
        </table>
      </section>

      <!-- Error Modal -->
      <div id="errorModal" class="modal hidden">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <h2>Error</h2>
          <p id="errorMessage">Something went wrong.</p>
        </div>
      </div>

      <script>
        const errorModal = document.getElementById("errorModal");
        const closeModal = document.getElementById("closeModal");
        const errorMessage = document.getElementById("errorMessage");

        function showError(message) {
          errorMessage.textContent = message;
          errorModal.classList.remove("hidden");
        }

        closeModal.onclick = () => {
          errorModal.classList.add("hidden");
        };

        window.onclick = (event) => {
          if (event.target === errorModal) {
            errorModal.classList.add("hidden");
          }
        };
      </script>
    </div>
  </body>
</html>
